<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gate90</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-dark: #131F24; --green-main: #58CC02; --green-shadow: #46A302;
            --blue-main: #1CB0F6; --blue-shadow: #1899D6; --red-streak: #FF4B4B;
            --gray-locked: #37464F; --gray-locked-shadow: #202F36;
        }
        body { background-color: var(--bg-dark); color: white; font-family: 'Nunito', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* Oculta a barra de rolagem mas permite rolar */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        
        .perspective-1000 { perspective: 1000px; }
        #flashcard { touch-action: none; /* Evita que a tela role enquanto arrasta o card */ }
    </style>
</head>
<body class="flex flex-col h-screen relative overflow-hidden">

    <!-- CABEÇALHO (Toque e segure a foto para Resetar) -->
    <header class="flex justify-between items-center p-4 sticky top-0 z-10 bg-[#131F24] border-b border-gray-800 shrink-0">
        <div id="btn-reset" class="w-10 h-10 rounded-full border-2 border-gray-700 overflow-hidden bg-white active:scale-95 transition-transform">
            <img src="151623.png" alt="Mascote" class="w-full h-full object-cover">
        </div>
        <div class="flex items-center space-x-6 text-sm font-extrabold">
            <div class="flex items-center space-x-2 text-white"><span class="text-xl">🇺🇸</span><span>1</span></div>
            <div class="flex items-center space-x-1 text-[var(--red-streak)]">
                <svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5"><path d="M11.66 22q-2.4 0-4.22-1.52T5.62 16.5q0-1.74.88-3.08t2.25-2.2q.21-.14.4-.33t.34-.41q.85-1.09 1.13-2.58.12-.66.07-1.39-.02-.33.19-.52.22-.2.53-.08 1.34.48 2.21 1.4.88.93 1.35 2.16.48 1.23.48 2.65 0 2.95-2.07 5.01T11.66 22Z"/></svg>
                <span id="streak-counter">1</span>
            </div>
        </div>
    </header>

    <!-- TRILHA DE APRENDIZADO (Gerada dinamicamente pelo JS) -->
    <main class="flex-1 overflow-y-auto pb-24 relative flex flex-col items-center w-full" id="scroll-area">
        
        <!-- Banner Inicial -->
        <div class="w-11/12 max-w-md mt-6 p-4 rounded-2xl bg-[var(--green-main)] flex justify-between items-center shadow-lg">
            <div>
                <p class="text-white/80 text-xs font-bold tracking-widest uppercase mb-1">Bloco 1</p>
                <h2 class="text-white text-xl font-bold leading-tight">Imigração e Aeroporto</h2>
            </div>
        </div>

        <!-- CONTAINER DA TRILHA DE 90 DIAS -->
        <div id="trail-container" class="mt-10 flex flex-col items-center gap-6 w-full pb-20">
            <!-- O JavaScript vai injetar os 90 dias aqui dentro -->
        </div>

    </main>

    <!-- TELA DO MENU DO DIA -->
    <div id="daily-menu" class="fixed inset-0 bg-[#131F24] z-30 flex flex-col transition-transform duration-300 translate-y-full opacity-0">
        <div class="p-6 flex justify-between items-center border-b border-gray-800">
            <h2 id="menu-title" class="text-2xl font-bold text-white">Tarefas do Dia</h2>
            <button onclick="fecharTela('daily-menu')" class="text-gray-400 p-2"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
        </div>
        
        <div class="flex-1 p-6 space-y-4 overflow-y-auto">
            <button onclick="abrirFlashcards()" class="w-full bg-[var(--gray-locked)] border-b-4 border-[var(--gray-locked-shadow)] p-4 rounded-2xl flex items-center justify-between active:translate-y-1 active:border-b-0 transition-all">
                <div class="flex items-center space-x-4">
                    <div class="bg-[var(--blue-main)] p-3 rounded-xl"><svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg></div>
                    <div class="text-left">
                        <h3 class="font-bold text-white">Cards Interativos</h3>
                        <p class="text-xs text-gray-400">Treine a leitura e fala</p>
                    </div>
                </div>
                <div class="text-[var(--green-main)] font-bold">COMEÇAR</div>
            </button>
            <!-- Mais tarefas podem ser adicionadas aqui -->
        </div>
    </div>

    <!-- TELA DOS FLASHCARDS (Arrastar para os lados) -->
    <div id="flashcard-screen" class="fixed inset-0 bg-[#131F24] z-40 flex flex-col transition-transform duration-300 translate-x-full opacity-0">
        <div class="p-4 flex justify-between items-center border-b border-gray-800">
            <button onclick="fecharTela('flashcard-screen')" class="text-gray-400 p-2"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg></button>
            <div class="w-full mx-4 h-3 bg-gray-800 rounded-full overflow-hidden">
                <div class="h-full bg-[var(--green-main)] w-1/5 rounded-full transition-all"></div>
            </div>
        </div>
        
        <div class="flex-1 flex items-center justify-center p-6 w-full relative perspective-1000 overflow-hidden">
            
            <!-- O CARD EM SI -->
            <div id="flashcard" class="w-full max-w-sm h-[400px] bg-[var(--gray-locked)] rounded-3xl shadow-2xl border border-gray-700 p-6 flex flex-col items-center justify-center text-center transition-transform duration-200 cursor-grab relative">
                
                <!-- Frente (Pergunta) -->
                <div id="card-front" class="w-full h-full flex flex-col items-center justify-center">
                    <p class="text-gray-400 text-sm mb-4 uppercase tracking-widest font-bold">Como você diria?</p>
                    <h2 class="text-2xl font-bold text-white leading-tight">Pedir uma mesa para você, sua esposa e sua filha.</h2>
                    <button class="mt-8 bg-[var(--blue-main)] text-white px-6 py-3 rounded-full font-bold uppercase tracking-widest shadow-lg animate-pulse" onclick="virarCard()">Revelar Resposta</button>
                </div>

                <!-- Verso (Resposta Oculta inicialmente) -->
                <div id="card-back" class="w-full h-full flex flex-col items-center justify-center hidden">
                    <h2 class="text-3xl font-black text-[var(--green-main)] mb-4">"A table for three, please."</h2>
                    <p class="text-gray-400 text-sm italic bg-[#131F24] px-4 py-3 rounded-xl border border-gray-800 mb-8">A tei-bôu fór tri, plíz.</p>
                    
                    <p class="text-xs text-gray-500 mb-4 font-bold uppercase tracking-widest">Deslize o card ou use os botões</p>
                    
                    <!-- Botões clicáveis (Caso o usuário prefira clicar em vez de arrastar) -->
                    <div class="flex justify-between w-full mt-auto gap-4">
                        <button onclick="processarResposta('errei')" class="flex-1 bg-[#131F24] border-2 border-red-500/50 text-red-400 font-bold py-4 rounded-2xl active:bg-red-500 active:text-white transition-colors">
                            &larr; ERREI
                        </button>
                        <button onclick="processarResposta('facil')" class="flex-1 bg-[#131F24] border-2 border-green-500/50 text-green-400 font-bold py-4 rounded-2xl active:bg-green-500 active:text-white transition-colors">
                            FÁCIL &rarr;
                        </button>
                    </div>
                </div>
            </div>
            
        </div>
    </div>

    <!-- Navegação Inferior -->
    <nav class="fixed bottom-0 w-full bg-[#131F24] border-t-2 border-gray-800 flex justify-around items-center p-3 z-0 shrink-0">
        <button class="text-[var(--green-main)] p-2 bg-[var(--green-main)]/10 rounded-xl"><svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></button>
        <button class="text-gray-500 hover:text-white transition"><svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg></button>
    </nav>

    <script>
        // CONFIGURAÇÃO INICIAL (Dia 1 de 90)
        let diaAtual = 1; 
        const totalDias = 90;
        
        // 1. GERAÇÃO DINÂMICA DA TRILHA
        const trailContainer = document.getElementById('trail-container');
        const posicoesX = [-30, 20, -15, 35]; // Padrão de zigue-zague

        function renderizarTrilha() {
            trailContainer.innerHTML = ''; // Limpa a trilha
            
            // Calcula qual é o próximo mascote (20, 40, 60, 80)
            let proximoMascote = Math.ceil(diaAtual / 20) * 20;
            if (proximoMascote === 0) proximoMascote = 20;
            if (proximoMascote > 80) proximoMascote = 90;

            for (let i = 1; i <= totalDias; i++) {
                const offsetX = posicoesX[(i - 1) % posicoesX.length];
                const isRevisao = (i % 4 === 0); // Dia de revisão a cada 4 dias
                let estado = '';
                
                if (i < diaAtual) estado = 'concluido';
                else if (i === diaAtual) estado = 'ativo';
                else estado = 'bloqueado';

                let nodeHTML = '';
                
                if (estado === 'concluido') {
                    nodeHTML = `
                        <div class="translate-x-[${offsetX}px] w-full flex justify-center">
                            <button class="w-[70px] h-[70px] rounded-full bg-[var(--green-main)] border-b-[6px] border-[var(--green-shadow)] flex items-center justify-center text-white">
                                <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg>
                            </button>
                        </div>`;
                } 
                else if (estado === 'ativo') {
                    nodeHTML = `
                        <div class="translate-x-[${offsetX}px] w-full flex justify-center mt-2 mb-2 relative z-10" id="dia-ativo">
                            <!-- Balão do Dia Ativo -->
                            <div class="absolute -top-12 bg-[#37464F] border border-gray-600 text-[var(--green-main)] text-sm font-extrabold uppercase tracking-widest px-4 py-2 rounded-xl animate-bounce shadow-lg after:content-[''] after:absolute after:top-full after:left-1/2 after:-translate-x-1/2 after:border-8 after:border-transparent after:border-t-[#37464F]">
                                Dia ${i}
                            </div>
                            <!-- Botão Pulsante -->
                            <button onclick="abrirMenuDoDia(${i})" class="w-[85px] h-[85px] rounded-full bg-[var(--green-main)] border-b-[8px] border-[var(--green-shadow)] flex items-center justify-center text-white text-3xl font-black relative ring-4 ring-white/10 shadow-2xl active:translate-y-1 active:border-b-0">
                                ${i}
                            </button>
                            <div class="absolute top-0 w-[85px] h-[85px] rounded-full bg-[var(--green-main)] opacity-30 animate-ping -z-10"></div>
                        </div>`;
                } 
                else {
                    // Bloqueado
                    let iconeBloqueado = `<span class="text-2xl font-black">${i}</span>`;
                    if (isRevisao) {
                        iconeBloqueado = `<svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zM10 4h4v2h-4V4zm10 16H4V8h16v12z"/></svg>`;
                    }
                    nodeHTML = `
                        <div class="translate-x-[${offsetX}px] w-full flex justify-center relative">
                            <button class="w-[70px] h-[70px] rounded-full bg-[var(--gray-locked)] border-b-[6px] border-[var(--gray-locked-shadow)] flex items-center justify-center text-gray-500 cursor-not-allowed">
                                ${iconeBloqueado}
                            </button>
                            
                            ${i === proximoMascote ? `
                            <!-- MASCOTE ESPERANDO NA META (20, 40, etc) -->
                            <div class="absolute left-[60%] top-[-30px] flex items-end drop-shadow-xl z-10 w-48">
                                <img src="151623.png" class="w-16 h-16 rounded-full border-2 border-gray-600 bg-white" alt="Mascote">
                                <div class="bg-white text-gray-800 text-xs font-bold py-2 px-3 rounded-2xl rounded-bl-none ml-1 mb-6 shadow-lg whitespace-nowrap">
                                    Estou te esperando!
                                </div>
                            </div>
                            ` : ''}
                        </div>`;
                }
                
                trailContainer.insertAdjacentHTML('beforeend', nodeHTML);
            }
            
            // Centraliza a tela no dia ativo automaticamente ao carregar
            setTimeout(() => {
                const elementoAtivo = document.getElementById('dia-ativo');
                if(elementoAtivo) elementoAtivo.scrollIntoView({ behavior: "smooth", block: "center" });
            }, 500);
        }

        renderizarTrilha();

        // 2. FUNÇÃO DE RESET (Pressionar a foto do perfil por 2 segundos)
        let resetTimer;
        const btnReset = document.getElementById('btn-reset');
        
        btnReset.addEventListener('touchstart', () => {
            resetTimer = setTimeout(() => {
                diaAtual = 1;
                document.getElementById('streak-counter').textContent = '1';
                renderizarTrilha();
                alert("App reiniciado! Você voltou para o Dia 1.");
            }, 2000); // 2 segundos segurando
        });
        btnReset.addEventListener('touchend', () => clearTimeout(resetTimer));


        // 3. NAVEGAÇÃO ENTRE TELAS
        function abrirMenuDoDia(dia) {
            document.getElementById('menu-title').innerText = `Tarefas: Dia ${dia}`;
            document.getElementById('daily-menu').classList.replace('translate-y-full', 'translate-y-0');
            document.getElementById('daily-menu').classList.replace('opacity-0', 'opacity-100');
        }
        function fecharTela(id) {
            const el = document.getElementById(id);
            if(el.classList.contains('translate-y-0')) {
                el.classList.replace('translate-y-0', 'translate-y-full');
            } else {
                el.classList.replace('translate-x-0', 'translate-x-full');
            }
            el.classList.replace('opacity-100', 'opacity-0');
        }
        function abrirFlashcards() {
            fecharTela('daily-menu');
            document.getElementById('flashcard-screen').classList.replace('translate-x-full', 'translate-x-0');
            document.getElementById('flashcard-screen').classList.replace('opacity-0', 'opacity-100');
            
            // Reseta o card para a posição inicial (frente)
            document.getElementById('card-front').classList.remove('hidden');
            document.getElementById('card-back').classList.add('hidden');
            flashcard.style.transform = `translateX(0px) rotate(0deg)`;
        }

        // 4. FÍSICA E LÓGICA DOS FLASHCARDS (Arrastar estilo Tinder)
        const flashcard = document.getElementById('flashcard');
        const cardFront = document.getElementById('card-front');
        const cardBack = document.getElementById('card-back');
        let cardVirado = false;
        
        let startX = 0;
        let currentTranslate = 0;
        let isDragging = false;

        function virarCard() {
            cardFront.classList.add('hidden');
            cardBack.classList.remove('hidden');
            cardVirado = true;
            tocarPronuncia();
        }

        function tocarPronuncia() {
            if ('speechSynthesis' in window) {
                const fala = new SpeechSynthesisUtterance("A table for three, please.");
                fala.lang = 'en-US';
                fala.rate = 0.85;
                window.speechSynthesis.speak(fala);
            }
        }

        // Detecta o toque e inicio do arraste
        flashcard.addEventListener('touchstart', (e) => {
            if (!cardVirado) return; // Só permite arrastar se a resposta estiver visível
            startX = e.touches[0].clientX;
            isDragging = true;
            flashcard.style.transition = 'none'; // Remove a transição suave para grudar no dedo
        });

        // Move o card acompanhando o dedo
        flashcard.addEventListener('touchmove', (e) => {
            if (!isDragging || !cardVirado) return;
            const currentX = e.touches[0].clientX;
            currentTranslate = currentX - startX;
            // Inclina levemente o card enquanto puxa para o lado
            flashcard.style.transform = `translateX(${currentTranslate}px) rotate(${currentTranslate * 0.05}deg)`;
        });

        // Quando o usuário solta o dedo da tela
        flashcard.addEventListener('touchend', () => {
            if (!isDragging || !cardVirado) return;
            isDragging = false;
            flashcard.style.transition = 'transform 0.3s ease-out, opacity 0.3s ease-out'; // Volta a transição
            
            // Se puxou mais que 100px para a direita (FÁCIL)
            if (currentTranslate > 100) {
                processarResposta('facil');
            } 
            // Se puxou mais que 100px para a esquerda (ERREI)
            else if (currentTranslate < -100) {
                processarResposta('errei');
            } 
            // Se soltou antes da margem, o card volta pro meio como um elástico
            else {
                flashcard.style.transform = `translateX(0px) rotate(0deg)`;
            }
        });

        // Ação executada ao puxar até o final ou ao clicar nos botões diretamente
        function processarResposta(resultado) {
            if(resultado === 'facil') {
                flashcard.style.transform = `translateX(500px) rotate(30deg)`; // Joga pra direita
            } else {
                flashcard.style.transform = `translateX(-500px) rotate(-30deg)`; // Joga pra esquerda
            }
            flashcard.style.opacity = '0';
            
            setTimeout(() => {
                // Aqui no futuro puxaríamos a próxima palavra. 
                // Por enquanto vamos apenas fechar a tela para simular a conclusão.
                fecharTela('flashcard-screen');
                flashcard.style.transform = `translateX(0px) rotate(0deg)`;
                flashcard.style.opacity = '1';
                cardVirado = false;
                
                // Simula avançar 1 dia no progresso
                diaAtual++;
                document.getElementById('streak-counter').textContent = diaAtual;
                renderizarTrilha();
            }, 300);
        }

    </script>
</body>
</html>
